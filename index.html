<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tea House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">hover a tile</div>
  <button id="time-toggle" title="Switch between day and dusk (N)">☾ Dusk</button>
  <!-- The menu for the selected piece of furniture; furnitureUI.js moves it over the item. -->
  <div id="furni-menu" hidden>
    <button data-action="move">Move</button>
    <button data-action="rotate" title="Turn a quarter turn (R)">Rotate</button>
    <button data-action="pickup">Pick up</button>
  </div>
  <!-- Picked-up furniture, wrapped in a furoshiki cloth until you place it again. -->
  <div id="tray" hidden>
    <span class="tray-label">Furoshiki</span>
    <div class="tray-items"></div>
  </div>
  <div id="help">click a tile to walk there · drag, scroll or use the arrow keys to look around · Home recentres</div>
  <!-- type="module" lets us use import/export between files.
       Browsers block modules on file:// URLs, so serve this folder
       with a tiny static server (see README). -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
